name: Build PlatformIO Examples

on: 
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pio --version

    - name: Use checked-out SSLClient in examples
      run: |
        for config in examples/Esp32-platformIO/*/platformio.ini; do
          sed -i "s|digitaldragon/SSLClient@\^1.4.0|SSLClient=symlink://${GITHUB_WORKSPACE}|" "$config"
        done

    - name: Compile Examples
      run: |
        ./scripts/compile_pio_examples.sh --clean
